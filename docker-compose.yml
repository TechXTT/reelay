services:
  reelay:
    build: .
    image: reelay:latest
    restart: unless-stopped
    depends_on:
      qbittorrent:
        condition: service_healthy
    ports:
      - "7878:7878"
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - reelay-data:/data
      - media:/media

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    restart: unless-stopped
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      WEBUI_PORT: "8080"
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent-config:/config
      - media:/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  reelay-data:
  qbittorrent-config:
  # One shared filesystem is deliberate: /media/.downloads and /media/library
  # can hardlink. Separate Docker volumes cannot.
  media:

